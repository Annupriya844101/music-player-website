<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SoundSpace Admin</title><link rel="stylesheet" href="/style.css"></head><body><div class="app"><header class="top"><a class="brand" href="/"><span class="logo">♫</span> SoundSpace</a><a class="admin-link" href="/">← Player</a></header><main class="admin"><p class="eyebrow">LIBRARY MANAGEMENT</p><h1>Admin <span>console.</span></h1><p class="sub">Sync new audio messages from your Telegram private group.</p><label for="password">Admin password</label><input id="password" type="password" placeholder="Enter ADMIN_PASSWORD" autocomplete="current-password"><button id="sync" class="primary">↻ Sync Telegram library</button><p id="result" class="status">Your password is sent only to this server endpoint.</p><p class="hint">Upload or re-send tracks in the Telegram group after the bot is running. Never put your bot token in this page.</p></main></div><script>
document.getElementById('sync').addEventListener('click',async()=>{const b=document.getElementById('sync'),r=document.getElementById('result');b.disabled=true;r.textContent='Syncing…';try{const x=await fetch('/api/admin/sync',{method:'POST',headers:{'x-admin-password':document.getElementById('password').value}});const d=await x.json();r.textContent=x.ok?(d.message||'Sync complete'):(d.error||'Sync failed');}catch(e){r.textContent='Could not connect to server.'}finally{b.disabled=false}});
</script></body></html>
