<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100d1b"><title>SoundSpace — Your music</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="app">
<header class="top"><a class="brand" href="/"><span class="logo">♫</span> SoundSpace</a><span class="private"><i></i> PRIVATE LIBRARY</span><a class="admin-link" href="/admin.html">Admin ↗</a></header>
<main><section class="hero"><p class="eyebrow">YOUR PERSONAL SOUNDTRACK</p><h1>Music for your<br><span>own universe.</span></h1><p class="sub">A private library, just for you.</p><div class="search-wrap"><span>⌕</span><input id="search" placeholder="Search your library…" autocomplete="off"><kbd>⌘ K</kbd></div></section>
<section class="library"><div class="section-head"><div><p class="eyebrow">CURATED BY YOU</p><h2>Your library <span id="track-count">0 tracks</span></h2></div><button id="refresh" class="quiet">↻ Refresh</button></div><div id="status" class="status">Connecting to your private library…</div><div id="tracks" class="tracks"></div></section></main>
<footer class="player"><div class="now"><div class="cover" id="cover">♫</div><div class="now-text"><strong id="now-title">Choose a track</strong><span id="now-sub">SoundSpace Library</span></div><button id="like" class="icon-btn" title="Favorite">♡</button></div>
<div class="controls"><div class="buttons"><button id="shuffle" class="icon-btn" title="Shuffle">⤨</button><button id="prev" class="icon-btn" title="Previous">|‹</button><button id="play" class="play-btn" title="Play">▶</button><button id="next" class="icon-btn" title="Next">›|</button><button id="repeat" class="icon-btn" title="Repeat off">↻</button></div><div class="timeline"><span id="current-time">0:00</span><input id="seek" type="range" min="0" max="100" value="0"><span id="duration">0:00</span></div></div>
<div class="volume"><span>♫</span><input id="volume" type="range" min="0" max="1" step=".01" value=".8"></div></footer><audio id="audio" preload="metadata"></audio></div><script src="/app.js" defer></script></body></html>
