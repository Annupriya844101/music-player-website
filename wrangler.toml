name = "soundspace-music-player"
main = "worker.js"
compatibility_date = "2026-10-17"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/telegram-webhook"]

[[durable_objects.bindings]]
name = "LIBRARY"
class_name = "TrackLibrary"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TrackLibrary"]
