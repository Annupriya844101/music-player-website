name: Deploy to Railway
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @railway/cli
      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then echo "Add RAILWAY_TOKEN in repository Actions secrets."; exit 1; fi
          if [ -z "$RAILWAY_SERVICE_NAME" ]; then echo "Add RAILWAY_SERVICE_NAME in repository Actions variables."; exit 1; fi
          railway up --service "$RAILWAY_SERVICE_NAME" --detach